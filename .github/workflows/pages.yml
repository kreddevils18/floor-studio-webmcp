name: Verify and deploy Floor Studio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable && rustup target add wasm32-unknown-unknown
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test geometry
        run: cargo test --locked --manifest-path wasm/floor-core/Cargo.toml
      - name: Build WASM once
        run: bun run wasm:build
      - name: Check formatting, lint, and types
        run: bun run check
      - name: Run unit tests with coverage
        run: bun run test:coverage
      - name: Build production site
        run: bun run build:app
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Run browser tests
        run: bun run test:e2e
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: browser-test-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
